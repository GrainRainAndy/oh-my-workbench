function openPicker(id=null,append=false){const name=id?PLUGINS[findNode(id)?.view]?.name:null;modal(append?'添加插件视图':'选择插件视图',append?'新视图会放在当前工作区右侧。随后可以切分或交换位置。':`一个窗格承载一个视图；同一插件可以多次添加。${name?'当前为「'+name+'」。':''}`,`<div class="picker-grid">${Object.entries(PLUGINS).map(([k,p])=>`<button class="plugin-card" data-action="pick-view" data-plugin="${k}" data-id="${id||''}" data-append="${append?'1':'0'}" ${!state.enabled[k]?'disabled':''}><span class="pane-symbol ${k}">${icon(p.icon)}</span>${!state.enabled[k]?'<span class="pill">已停用</span>':''}<b>${p.name}</b><p>${p.desc}</p></button>`).join('')}</div>`,null,true)}
function pickView(plugin,id,append){if(!state.enabled[plugin])return;const config=plugin==='calendar'?{mode:'week',date:SAMPLE_DAY}:plugin==='tools'?{tool:'whisper'}:plugin==='tasks'?{filter:'all'}:{};pushUndo();maximized=null;if(append||!findNode(id)){if(leaves().length>=12){toast('此 Demo 每个工作区最多放置 12 个视图');closeModal();return}const newLeaf=leaf(plugin,config);ws().tree=ws().tree?split('x',ws().tree,newLeaf,.66):newLeaf;activePane=newLeaf.id}else{const n=findNode(id);n.view=plugin;n.config=config;activePane=n.id}closeModal();save();render();toast(`已添加「${PLUGINS[plugin].name}」视图`)}
function splitPane(id,axis){if(leaves().length>=12)return toast('此 Demo 每个工作区最多放置 12 个视图');const n=findNode(id);if(!n||n.type!=='leaf')return;pushUndo();const newLeaf=leaf();ws().tree=replaceNode(ws().tree,id,split(axis,n,newLeaf));activePane=newLeaf.id;maximized=null;closeMenu();save();render();openPicker(newLeaf.id)}
function swapPanes(a,b){if(a===b)return;const first=findNode(a),second=findNode(b);if(!first||!second||first.type!=='leaf'||second.type!=='leaf')return;pushUndo();const temp=uid('tmp'),c1=copy(first),c2=copy(second);ws().tree=replaceNode(ws().tree,a,{...c1,id:temp});ws().tree=replaceNode(ws().tree,b,c1);ws().tree=replaceNode(ws().tree,temp,c2);save();render();toast('已交换窗格位置')}
function newWorkspace(rename=false){modal(rename?'重命名工作区':'新建工作区','工作区保存布局与显示配置，不复制或隔离插件业务数据。',`<form id="workspaceForm" data-form="workspace" data-rename="${rename?'1':'0'}"><div class="field"><label for="workspaceInput">工作区名称</label><input id="workspaceInput" name="name" maxlength="30" value="${rename?esc(ws().name):''}" placeholder="例如：课程学习" required autofocus></div>${rename?'':`<div class="field"><label for="workspaceTemplate">从哪里开始</label><select name="template" id="workspaceTemplate"><option value="blank">空白工作区</option><option value="daily">日常 · 日程与待办</option><option value="research">研究 · 笔记与资源</option><option value="tools">资料处理 · 本地工具</option></select></div>`}<p class="form-error" id="workspaceError"></p></form>`,`<button class="button" data-action="close-modal">取消</button><button class="button primary" type="submit" form="workspaceForm">${rename?'保存名称':'创建工作区'}</button>`)}

function taskDialog(id=null){const t=state.tasks.find(x=>x.id===id)||{title:'',group:'收件箱',due:SAMPLE_DAY,priority:'normal'};modal(id?'编辑待办':'新建待办','所有待办视图共享数据；每个视图保留自己的筛选条件。',`<form id="taskForm" data-form="task" data-id="${id||''}"><div class="field"><label for="taskTitle">事项</label><input id="taskTitle" name="title" maxlength="120" value="${esc(t.title)}" required autofocus></div><div class="form-row"><div class="field"><label for="taskGroup">清单 / 项目</label><input id="taskGroup" name="group" maxlength="40" value="${esc(t.group)}"></div><div class="field"><label for="taskDue">截止日期</label><input id="taskDue" name="due" type="date" value="${esc(t.due)}"></div></div><div class="field"><label for="taskPriority">优先级</label><select id="taskPriority" name="priority"><option value="normal" ${t.priority==='normal'?'selected':''}>普通</option><option value="high" ${t.priority==='high'?'selected':''}>较高</option></select></div><p class="form-error" id="taskError"></p></form>`,`${id?`<button class="button danger" style="margin-right:auto" data-action="delete-task" data-id="${id}">删除</button>`:''}<button class="button" data-action="close-modal">取消</button><button class="button primary" type="submit" form="taskForm">保存待办</button>`)}

function openResource(id){const r=state.resources.find(x=>x.id===id);if(!r)return;if(r.kind==='result')return showResult(r.jobId);const link=r.kind==='web'&&safeURL(r.path);modal(r.title,'资源引用预览',`<div class="notice">${r.sample?'这是示例入口，并不代表已经访问你的文件或账号。':r.kind==='web'?'点击下方链接将打开外部网站；不会向网站提供本地文件或 Demo 存档。':'浏览器 Demo 不具备桌面文件权限，此处展示并保存引用。'}</div><dl class="detail-grid"><dt>类型</dt><dd>${esc(({folder:'项目目录',file:'文件',web:'网页',session:'Agent Session'})[r.kind]||r.kind)}</dd><dt>引用</dt><dd>${esc(r.path||'尚未配置')}</dd><dt>数据范围</dt><dd>仅当前浏览器</dd></dl>`,`<button class="button danger" style="margin-right:auto" data-action="remove-resource" data-id="${id}">移除入口</button>${r.path?`<button class="button" data-action="copy-resource" data-id="${id}">${icon('copy')}复制引用</button>`:''}${link?`<a class="button primary" href="${esc(link)}" target="_blank" rel="noopener noreferrer">${icon('external')}打开网页</a>`:`<button class="button primary" data-action="close-modal">知道了</button>`}`)}

const resultTexts={whisper:'【模拟转写结果，不来自所选文件】\n\n00:00  今天讨论个人工作台的交互设计。\n\n00:08  工作区负责组织窗格，不应该替代插件自己的业务结构。\n\n00:17  关闭转写视图以后，任务仍然可以继续。在任务中心，我们应该能够找回状态和结果。\n\n00:31  下一步需要用实际场景验证：布局切换是否自然，常用工具是否容易找到。\n\n—— 以上为固定示例文本，未运行语音识别模型。',ocr:'【模拟 OCR 结果，不来自所选文件】\n\n个人工作台 · 设计笔记\n\n1. 以工作区为中心组织界面。\n2. 日程、待办和本地工具由插件提供。\n3. 允许横向、纵向切分窗格。\n4. 任务独立于视图运行，关闭窗格不取消任务。\n5. 数据留在本机，后续再讨论外部同步。\n\n—— 以上为固定示例文本，未运行文字识别模型。'};
function startJob(viewId){if(state.jobs.filter(j=>j.status==='running').length>=4)return toast('Demo 同时最多运行 4 个模拟任务');const n=findNode(viewId);if(!n||!state.enabled.tools)return;const tool=n.config.tool||'whisper',job={id:uid('job'),viewId,tool,file:selectedFiles.get(viewId)?.name||(tool==='whisper'?'课堂录音_示例.m4a':'设计笔记_示例.png'),status:'running',progress:0,started:Date.now(),duration:tool==='whisper'?14000:9000};state.jobs.unshift(job);state.jobs=state.jobs.filter((j,i)=>i<50||j.status==='running'||state.resources.some(r=>r.jobId===j.id));save();refreshView('tools');renderNav();updateJobUI();if(drawerOpen)renderDrawer();toast('模拟任务已开始；切换工作区或关闭窗格后仍会继续');}
function tickJobs(){let dirty=false,completed=false;for(const job of state.jobs){if(job.status!=='running')continue;const p=Math.min(100,Math.floor((Date.now()-job.started)/job.duration*100));if(p!==job.progress){job.progress=p;dirty=true}if(p>=100){job.status='succeeded';job.finished=Date.now();completed=true;toast(`${job.tool==='whisper'?'转写':'识别'}模拟完成，可在任务中心查看示例结果`)}}if(dirty)updateJobUI();if(completed){save();renderNav();refreshView('tools');if(drawerOpen)renderDrawer()}}

function updateJobUI(){for(const n of leaves()){if(n.view!=='tools')continue;const el=document.querySelector(`[data-job-inline="${n.id}"]`);if(!el)continue;const j=state.jobs.find(j=>j.viewId===n.id);if(!j){el.classList.add('hidden');continue}el.classList.remove('hidden');el.innerHTML=`<div class="job-inline-head"><span>${j.status==='running'?`正在模拟${j.tool==='whisper'?'转写':'识别'}…`:'模拟任务 · '+jobLabel(j)}</span>${j.status==='succeeded'?`<button class="link-button" data-action="show-result" data-id="${j.id}">查看结果 →</button>`:`<button class="link-button" data-action="jobs">${j.status==='running'?j.progress+'%':'任务中心'}</button>`}</div>${j.status==='running'?`<div class="progress-track"><div class="progress-fill" style="width:${j.progress}%"></div></div>`:''}`;}for(const j of state.jobs){const fill=document.querySelector(`[data-progress="${j.id}"]`);if(fill)fill.style.width=j.progress+'%';const pct=document.querySelector(`[data-percent="${j.id}"]`);if(pct)pct.textContent=j.progress+'%';}}

function renderDrawer(){if(!drawerOpen)return;$('#drawerRoot').innerHTML=`<div class="drawer-backdrop" data-action="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="任务中心"><header class="drawer-heading"><div><h2>任务中心</h2><p>独立于窗格运行 · 当前页面中的模拟任务</p></div><button class="icon-btn" data-action="close-drawer" title="关闭任务中心">${icon('close')}</button></header><div class="drawer-body"><div class="notice">可以切换工作区、关闭工具窗格，再回来查看进度。关闭或刷新整个页面会中断未完成的模拟任务。</div>${state.jobs.length?state.jobs.map(j=>`<article class="job-card"><div class="job-card-title">${icon(j.tool==='whisper'?'audio':'scan')}<b>${j.tool==='whisper'?'Whisper 转写':'OCR 识别'}</b><span class="pill ${j.status==='succeeded'?'green':j.status==='running'?'purple':'amber'}">${jobLabel(j)}</span></div><p>${esc(j.file)}<br>模拟任务，不读取或处理文件内容</p>${j.status==='running'?`<div class="job-inline-head"><span>处理中</span><span data-percent="${j.id}">${j.progress}%</span></div><div class="progress-track"><div class="progress-fill" data-progress="${j.id}" style="width:${j.progress}%"></div></div>`:''}${j.status==='interrupted'?'<p>页面在任务完成前关闭或刷新。可回到工具视图重新发起模拟。</p>':''}<div class="job-actions">${j.status==='running'?`<button class="button" data-action="cancel-job" data-id="${j.id}">取消任务</button>`:j.status==='succeeded'?`<button class="button primary" data-action="show-result" data-id="${j.id}">查看示例结果</button>`:''}</div></article>`).join(''):`<div class="empty">${icon('activity')}<h3>暂时没有任务</h3><p>在「本地工具」视图中点击模拟转写或模拟识别，体验后台任务。</p></div>`}</div></aside>`}
function showResult(id){const j=state.jobs.find(j=>j.id===id);if(!j||j.status!=='succeeded')return;modal('处理结果 · 模拟',j.file,`<div class="notice">以下是固定示例文本，用于演示复制、导出与归档流程，并非实际模型输出。</div><div class="result-text">${esc(resultTexts[j.tool])}</div>`,`<button class="button" data-action="archive-result" data-id="${id}">${icon('folder')}加入常用入口</button><button class="button" data-action="export-result" data-id="${id}">${icon('export')}导出</button><button class="button primary" data-action="copy-result" data-id="${id}">${icon('copy')}复制文本</button>`,true)}
function download(name,text,mime='application/json'){const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('not available')}toast('已复制到剪贴板')}catch{modal('复制文本','当前浏览器限制了剪贴板，请在下方选择并复制。',`<textarea readonly style="width:100%;min-height:180px">${esc(text)}</textarea>`,`<button class="button" data-action="close-modal">关闭</button>`)}}
function settingsDialog(){modal('Demo 设置','这是产品交互原型，不是完整桌面宿主。',`<div class="notice"><b>数据只保存在当前浏览器。</b><br>没有账号、云同步、真实模型调用或校园访问。浏览器存储被清除后，Demo 数据也会消失。不要录入敏感信息。</div><div class="shortcut-row"><span>深色主题</span><button class="switch ${state.theme==='dark'?'on':''}" role="switch" aria-checked="${state.theme==='dark'}" data-action="settings-theme" aria-label="深色主题"></button></div><div class="shortcut-row"><span>工作区布局</span><button class="button" data-action="export-workspaces">导出配置</button></div><div class="shortcut-row"><span>导入布局（不导入业务数据）</span><button class="button" data-action="import-workspaces">导入 JSON</button></div><div class="shortcut-row"><span>回到最初的示例内容</span><button class="button danger" data-action="reset-demo">重置 Demo</button></div>`,`<button class="button primary" data-action="close-modal">完成</button>`)}
function helpDialog(){modal('先试试这四件事','这份 Demo 用于检验工作方式，不代表技术栈或最终视觉设计已经确定。',`<div class="help-steps"><div class="help-step"><i>1</i><div><b>摆一张适合自己的桌面</b><p>点窗格右上角「···」进行左右 / 上下切分。拖动分隔线调整比例，拖动标题左侧手柄交换位置。</p></div></div><div class="help-step"><i>2</i><div><b>切换上下文，而不是复制数据</b><p>点击左侧三个工作区，或新建、复制工作区。待办和日程数据共享，显示配置独立。</p></div></div><div class="help-step"><i>3</i><div><b>让工具运行，自己去做别的事</b><p>开始模拟转写后关闭工具窗格，再从「任务中心」查看进度与结果。刷新或关闭页面则会中断。</p></div></div><div class="help-step"><i>4</i><div><b>真的动手改一改</b><p>新增和勾选待办；点击日程卡片编辑，点击周历空白添加；调整插件启停，检查布局如何恢复。</p></div></div></div><div class="notice" style="margin-top:19px;margin-bottom:0">全部初始内容均为示例。Demo 不请求网络、不读文件内容；只使用所选文件的名称演示流程。日期固定为 2026 年 11 月 18 日。</div><div class="shortcut-row"><span>搜索与命令</span><kbd class="kbd">⌘ / Ctrl K</kbd></div><div class="shortcut-row"><span>撤销布局变化</span><kbd class="kbd">⌘ / Ctrl Z</kbd></div><div class="shortcut-row"><span>关闭弹窗 / 退出放大</span><kbd class="kbd">Esc</kbd></div>`,`<button class="button primary" data-action="close-modal">开始体验</button>`,true)}
function getCommands(){return [...state.workspaces.map(w=>({name:'切换到 '+w.name,icon:w.icon||'grid',tag:'工作区',run:()=>switchWorkspace(w.id)})),{name:'新建工作区',icon:'plus',tag:'工作区',run:()=>newWorkspace()},{name:'添加插件视图',icon:'puzzle',tag:'布局',run:()=>openPicker(null,true)},{name:'新建待办',icon:'tasks',tag:'待办',run:()=>state.enabled.tasks?taskDialog():toast('请先启用待办插件')},{name:'添加日程',icon:'calendar',tag:'日程',run:()=>state.enabled.calendar?eventDialog():toast('请先启用日程插件')},{name:'打开任务中心',icon:'activity',tag:'工具',run:openJobs},{name:'管理插件',icon:'puzzle',tag:'系统',run:pluginsDialog},{name:'切换明暗主题',icon:'moon',tag:'显示',run:()=>{state.theme=state.theme==='dark'?'light':'dark';setTheme();save()}},{name:'使用指南',icon:'help',tag:'帮助',run:helpDialog}]}
let commands=[];function commandPalette(){closeMenu();if($('#modalRoot').children.length)closeModal();lastFocus=document.activeElement;commands=getCommands();$('#modalRoot').innerHTML=`<div class="overlay" data-overlay="true"><section class="modal" role="dialog" aria-modal="true" aria-label="搜索命令"><input class="command-input" id="commandInput" placeholder="搜索工作区、操作或插件…" autocomplete="off" aria-label="搜索命令"><div class="command-results" id="commandResults"></div><div class="command-footer">输入关键词筛选 · Enter 执行第一项 · Esc 关闭</div></section></div>`;filterCommands('');setTimeout(()=>$('#commandInput')?.focus(),20)}
function filterCommands(q){const matching=commands.map((c,i)=>({...c,index:i})).filter(c=>(c.name+c.tag).toLowerCase().includes(q.toLowerCase()));$('#commandResults').innerHTML=matching.length?matching.map(c=>`<button class="command-item" data-action="run-command" data-index="${c.index}">${icon(c.icon)}<span>${esc(c.name)}</span><span>${c.tag}</span></button>`).join(''):'<div class="empty" style="min-height:90px"><p>没有找到匹配操作。</p></div>'}

 switch(a){

 case 'workspace-menu':workspaceMenu(el);break;
 case 'delete-workspace':confirmModal('删除「'+ws().name+'」？','只删除当前工作区的布局和视图配置，不删除待办、日程、文件引用或运行任务。','confirm-delete-workspace','删除工作区',true);break;
 case 'confirm-delete-workspace':{state.workspaces=state.workspaces.filter(w=>w.id!==state.active);if(!state.workspaces.length)state.workspaces.push({id:uid('workspace'),name:'新工作区',icon:'grid',kind:'blank',tree:null});closeModal();switchWorkspace(state.workspaces[0].id);toast('已删除工作区，业务数据保持不变');break}
 case 'reset-layout':confirmModal('恢复默认布局？','只重置当前工作区的窗格配置，不会修改业务数据。此操作可以撤销。','confirm-reset-layout','恢复布局');break;
 case 'confirm-reset-layout':pushUndo();ws().tree=ws().kind==='blank'?null:defaultTree(ws().kind);maximized=null;closeModal();save();render();toast('已恢复默认布局');break;
 case 'add-view':openPicker(null,true);break;case 'replace-view':openPicker(id);break;case 'pick-view':pickView(plugin,id,el.dataset.append==='1');break;
 case 'pane-menu':paneMenu(el,id);break;case 'split-x':splitPane(id,'x');break;case 'split-y':splitPane(id,'y');break;
 case 'swap-pane':{const all=leaves(),i=all.findIndex(n=>n.id===id);closeMenu();if(all.length>1)swapPanes(id,all[(i+1)%all.length].id);else toast('只有一个窗格，无需交换');break}
 case 'maximize':maximized=maximized===id?null:id;closeMenu();renderLayout();break;
 case 'close-pane':pushUndo();ws().tree=removeNode(ws().tree,id);if(maximized===id)maximized=null;closeMenu();save();render();toast('已关闭视图；业务数据和任务不会被删除');break;
 case 'undo':{const stack=undoMap[state.active];if(stack?.length){ws().tree=stack.pop();maximized=null;save();render();toast('已撤销上次布局操作')}break}
 case 'calendar-mode':{const n=findNode(id);n.config.mode=value;save();refreshView('calendar');break}
 case 'calendar-prev':case 'calendar-next':case 'calendar-today':{const n=findNode(id),d=parseDate(n.config.date||SAMPLE_DAY);if(a==='calendar-today')n.config.date=SAMPLE_DAY;else if(n.config.mode==='month'){d.setDate(1);d.setMonth(d.getMonth()+(a==='calendar-prev'?-1:1));n.config.date=fmtDate(d)}else n.config.date=addDays(n.config.date||SAMPLE_DAY,a==='calendar-prev'?-7:7);save();refreshView('calendar');break}
 case 'calendar-slot':{if(event.target.closest('.cal-event'))break;const rect=el.getBoundingClientRect();const hour=Math.min(18,9+Math.floor((event.clientY-rect.top)/36));eventDialog(null,el.dataset.date,String(hour).padStart(2,'0')+':00');break}
 case 'new-event-date':eventDialog(null,el.dataset.date);break;case 'edit-event':eventDialog(id);break;
 case 'delete-event':state.events=state.events.filter(e=>e.id!==id);closeModal();save();refreshView('calendar');toast('已删除日程');break;
 case 'task-filter':findNode(id).config.filter=value;save();refreshView('tasks');break;case 'clear-task-group':delete findNode(id).config.group;save();refreshView('tasks');break;
 case 'toggle-task':{const t=state.tasks.find(t=>t.id===id);if(t){t.done=!t.done;save();refreshView('tasks')}break}
 case 'edit-task':taskDialog(id);break;case 'delete-task':state.tasks=state.tasks.filter(t=>t.id!==id);closeModal();save();refreshView('tasks');toast('已删除待办');break;
 case 'new-resource':resourceDialog();break;case 'open-resource':openResource(id);break;
 case 'remove-resource':state.resources=state.resources.filter(r=>r.id!==id);closeModal();save();refreshView('resources');toast('已移除入口，没有删除原始内容');break;
 case 'copy-resource':copyText(state.resources.find(r=>r.id===id)?.path||'');break;
 case 'tool-mode':findNode(id).config.tool=value;selectedFiles.delete(id);save();refreshView('tools');break;
 case 'select-file':toolFileTarget=id;$('#toolFileInput').accept=findNode(id).config.tool==='ocr'?'image/*':'audio/*';$('#toolFileInput').value='';$('#toolFileInput').click();break;
 case 'start-job':startJob(id);break;
 case 'cancel-job':{const j=state.jobs.find(j=>j.id===id);if(j&&j.status==='running'){j.status='cancelled';save();refreshView('tools');renderNav();renderDrawer();toast('模拟任务已取消')}break}
 case 'show-result':showResult(id);break;
 case 'copy-result':{const j=state.jobs.find(j=>j.id===id);if(j)copyText(resultTexts[j.tool]);break}
 case 'export-result':{const j=state.jobs.find(j=>j.id===id);if(j){download('模拟结果_'+j.tool+'.txt',resultTexts[j.tool],'text/plain;charset=utf-8');toast('已导出示例结果')}break}
 case 'archive-result':{if(!state.enabled.resources)return toast('请先在插件管理中启用常用入口');const j=state.jobs.find(j=>j.id===id);if(state.resources.some(r=>r.jobId===id))return toast('该结果已经存在于常用入口');state.resources.unshift({id:uid('resource'),kind:'result',title:j.file+' · 模拟结果',detail:'来自 '+(j.tool==='whisper'?'Whisper':'OCR')+' · 固定示例文本',jobId:id});save();refreshView('resources');toast('已通过演示接口加入常用入口');break}
 case 'export-workspaces':{closeMenu();download('workbench-layouts.json',JSON.stringify({format:'workbench-demo-layout',version:1,workspaces:state.workspaces,active:state.active},null,2));toast('已导出布局，不包含业务数据或凭据');break}
 case 'import-workspaces':closeMenu();$('#importInput').value='';$('#importInput').click();break;
 case 'reset-demo':confirmModal('重置整个 Demo？','将删除此 Demo 在当前浏览器中的布局、编辑内容和任务记录，并重新载入示例。这不会影响任何外部文件或应用。','confirm-reset-demo','重置 Demo',true);break;
 case 'confirm-reset-demo':state=initialState();undoMap={};activePane=null;maximized=null;selectedFiles.clear();closeModal();closeDrawer();save();render();toast('已恢复初始示例');break;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){if(b.disabled)return;action(b.dataset.action,b,e);return}if(e.target.classList.contains('overlay')){closeModal();return}if(!e.target.closest('#popover'))closeMenu()});
document.addEventListener('pointerdown',e=>{const p=e.target.closest('.pane');if(p){activePane=p.dataset.pane;$$('.pane').forEach(x=>x.classList.toggle('focused',x.dataset.pane===activePane))}});
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const data=Object.fromEntries(new FormData(form));const type=form.dataset.form;
 if(type==='quick-task'){const title=data.title?.trim();if(!title)return;const n=findNode(form.dataset.pane);state.tasks.push({id:uid('task'),title,group:n?.config.group||'收件箱',due:SAMPLE_DAY,priority:'normal',done:false});save();refreshView('tasks');toast('已添加待办');return}
 if(type==='workspace'){const name=data.name?.trim();if(!name){$('#workspaceError').textContent='请填写工作区名称';return}if(form.dataset.rename==='1'){ws().name=name;closeModal();save();render()}else{if(state.workspaces.length>=20){$('#workspaceError').textContent='Demo 最多保存 20 套工作区';return}const kind=data.template||'blank',w={id:uid('workspace'),name,kind,icon:kind==='tools'?'folder':kind==='research'?'research':'grid',tree:kind==='blank'?null:defaultTree(kind)};state.workspaces.push(w);closeModal();switchWorkspace(w.id)}return}
 if(type==='task'){if(!data.title?.trim()){$('#taskError').textContent='事项名称不能为空';return}const id=form.dataset.id;const obj={title:data.title.trim(),group:data.group.trim()||'收件箱',due:data.due,priority:data.priority};if(id){Object.assign(state.tasks.find(t=>t.id===id),obj)}else state.tasks.push({id:uid('task'),...obj,done:false});closeModal();save();refreshView('tasks');toast('待办已保存');return}
 if(type==='event'){if(!data.title?.trim()||!data.date||!data.start||!data.end){$('#eventError').textContent='请填写日程名称、日期和时间';return}if(data.end<=data.start){$('#eventError').textContent='结束时间必须晚于开始时间。此 Demo 暂不支持跨日事件。';return}const id=form.dataset.id,obj={title:data.title.trim(),date:data.date,start:data.start,end:data.end,color:data.color,location:data.location.trim()};if(id)Object.assign(state.events.find(x=>x.id===id),obj);else state.events.push({id:uid('event'),...obj});closeModal();save();refreshView('calendar');toast('日程已保存');return}
 if(type==='resource'){if(!data.title?.trim()||!data.path?.trim()){$('#resourceError').textContent='请填写名称和引用';return}if(data.kind==='web'&&!safeURL(data.path.trim())){$('#resourceError').textContent='网页地址需要使用 http:// 或 https://';return}state.resources.push({id:uid('resource'),title:data.title.trim(),kind:data.kind,path:data.path.trim(),detail:({folder:'项目目录',file:'文件',web:'网页',session:'Agent Session'})[data.kind]+' · 自定义入口',sample:false});closeModal();save();refreshView('resources');toast('入口已添加');return}

document.addEventListener('input',e=>{if(e.target.id==='commandInput')filterCommands(e.target.value);if(e.target.matches('[data-note]')){state.notes=e.target.value;for(const other of $$('[data-note]'))if(other!==e.target)other.value=state.notes;save()}});
$('#toolFileInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(f&&toolFileTarget){selectedFiles.set(toolFileTarget,{name:f.name,size:f.size,type:f.type});refreshView('tools');toast('已选择文件名；不会读取或上传文件内容')}});
$('#importInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{if(f.size>1048576)throw Error('配置文件不能超过 1 MB');const obj=JSON.parse(await f.text());if(obj.format!=='workbench-demo-layout'||obj.version!==1)throw Error('不是本 Demo 支持的布局文件');validateWorkspaces(obj.workspaces);const incoming=obj.workspaces.map(w=>({...w,id:uid('workspace'),name:w.name+'（导入）',tree:cloneTree(w.tree)}));if(state.workspaces.length+incoming.length>20)throw Error('导入后工作区总数超过 20');state.workspaces.push(...incoming);closeModal();switchWorkspace(incoming[0].id);toast('已追加导入 '+incoming.length+' 套工作区，原有布局未覆盖')}catch(err){toast('导入失败：'+err.message)}});
document.addEventListener('keydown',e=>{const typing=e.target.matches('input,textarea,select,[contenteditable]');if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commandPalette();return}if(e.key==='Escape'){if($('#modalRoot').children.length)closeModal();else if($('#popover').children.length)closeMenu();else if(drawerOpen)closeDrawer();else if(maximized){maximized=null;renderLayout()}return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();action('undo',$('#undoButton'),e);return}if(e.target.id==='commandInput'&&e.key==='Enter'){e.preventDefault();$('#commandResults .command-item')?.click();return}if(e.target.classList.contains('splitter')&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const n=findNode(e.target.dataset.split);pushUndo();n.ratio=Math.max(.12,Math.min(.88,n.ratio+(['ArrowLeft','ArrowUp'].includes(e.key)?-.04:.04)));save();renderLayout();document.querySelector(`[data-split="${n.id}"]`)?.focus();return}if(e.key==='Tab'&&$('#modalRoot').children.length){const targets=$$('#modalRoot button:not(:disabled), #modalRoot a[href], #modalRoot input:not(:disabled), #modalRoot select, #modalRoot textarea, #modalRoot [tabindex="0"]').filter(x=>x.offsetParent!==null);const first=targets[0],last=targets.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
document.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-split]');if(!handle)return;e.preventDefault();const n=findNode(handle.dataset.split);if(!n||n.type!=='split')return;pushUndo();const parent=handle.parentElement,slots=[parent.children[0],parent.children[2]],rect=parent.getBoundingClientRect(),old=n.ratio;handle.classList.add('dragging');handle.setPointerCapture(e.pointerId);const move=ev=>{const len=n.axis==='x'?rect.width:rect.height,position=n.axis==='x'?ev.clientX-rect.left:ev.clientY-rect.top;n.ratio=Math.max(.12,Math.min(.88,(position-5.5)/(len-11)));slots[0].style.flex=`${n.ratio} 1 0`;slots[1].style.flex=`${1-n.ratio} 1 0`;handle.setAttribute('aria-valuenow',Math.round(n.ratio*100))};const end=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end);handle.classList.remove('dragging');if(old===n.ratio)undoMap[state.active]?.pop();save();$('#undoButton').disabled=!(undoMap[state.active]?.length)};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end)});
document.addEventListener('dragstart',e=>{const grip=e.target.closest('[data-drag-pane]');if(!grip)return;dragPane=grip.dataset.dragPane;e.dataTransfer.setData('text/plain',dragPane);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const p=e.target.closest('.pane');if(p&&dragPane&&p.dataset.pane!==dragPane){e.preventDefault();e.dataTransfer.dropEffect='move';$$('.pane').forEach(x=>x.classList.toggle('drop-target',x===p))}});
document.addEventListener('drop',e=>{const p=e.target.closest('.pane');if(p&&dragPane){e.preventDefault();swapPanes(dragPane,p.dataset.pane)}dragPane=null;$$('.pane').forEach(x=>x.classList.remove('drop-target'))});document.addEventListener('dragend',()=>{dragPane=null;$$('.pane').forEach(x=>x.classList.remove('drop-target'))});
window.addEventListener('beforeunload',()=>{flushSave()});window.addEventListener('resize',()=>{closeMenu()});
$('#searchIcon').innerHTML=icon('search');$('#sideAdd').innerHTML=icon('plus');$('#profileSettings').innerHTML=icon('settings');$('#crumbIcon').innerHTML=icon('grid');$('#helpButton').innerHTML=icon('help');$('#undoButton').innerHTML=icon('undo')+'<span class="label-optional">撤销</span>';$('#workspaceMenuButton').innerHTML=icon('settings')+'<span>布局</span>';$('#addViewButton').innerHTML=icon('plus')+'<span>添加视图</span>';
render();flushSave();if(loadWarning)toast(storageOK?loadWarning:'此浏览器未开放本地存储，编辑仅在当前页面有效。');setInterval(tickJobs,300);

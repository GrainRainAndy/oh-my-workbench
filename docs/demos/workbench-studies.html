function popup(el,items){const m=$('menu');m.replaceChildren();items.forEach(([name,fn])=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{closeMenu();fn()};m.append(b)});m.hidden=false;let r=el.getBoundingClientRect();m.style.left=Math.max(4,Math.min(innerWidth-m.offsetWidth-5,r.right-m.offsetWidth))+'px';m.style.top=Math.max(4,Math.min(innerHeight-m.offsetHeight-5,r.bottom+3))+'px';m.anchor=el;m.firstChild.focus()}
function closeMenu(){let m=$('menu');if(!m.hidden){m.hidden=true;m.anchor?.focus()}}
document.addEventListener('pointerdown',e=>{if(!$('menu').hidden&&!$('menu').contains(e.target))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();if(!$('menu').hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();let a=[...$('menu').children],i=a.indexOf(document.activeElement);a[(i+(e.key==='ArrowDown'?1:-1)+a.length)%a.length].focus()}});
function message(s){$('notice').textContent=s;clearTimeout(message.timer);message.timer=setTimeout(()=>$('notice').textContent='',2500)}
function modal(title,body,ok,fn){const d=$('dlg');if(d.open)d.close();$('form').innerHTML='<h2 id="dlgtitle">'+esc(title)+'</h2>'+body+'<div class="dactions"><button type="button" onclick="dlg.close()">'+(fn?'取消':'关闭')+'</button>'+(fn?'<button class="primary">'+esc(ok)+'</button>':'')+'</div>';$('form').onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(Object.entries(v).some(([k,x])=>k!=='place'&&!String(x).trim())){message('请填写完整内容');return}if(fn&&fn(v)===false)return;d.close();draw()};d.showModal()}
const input=(label,key,value='',type='text')=>'<label>'+label+'<input required name="'+key+'" type="'+type+'" value="'+esc(value)+'"></label>';
const pick=(label,key,opts,val)=>'<label>'+label+'<select name="'+key+'">'+opts.map(([v,t])=>'<option value="'+esc(v)+'" '+(v===val?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label>';
const installed=()=>Object.keys(S().enabled).filter(k=>S().enabled[k]);
function workspace(op){let s=S(),w=W();if(op==='delete'){modal('删除工作区','<p>删除「'+esc(w.name)+'」的布局。插件数据和后台任务会保留。</p>','删除工作区',()=>{s.ws.splice(s.active,1);s.active=Math.max(0,s.active-1);page=''});return}
let title={new:'新建工作区',copy:'复制工作区',rename:'重命名工作区'}[op];
modal(title,input('工作区名称','name',op==='copy'?w.name+' 副本':op==='rename'?w.name:'')+(op==='new'?pick('初始窗格','kind',[...installed(),'empty'].map(k=>[k,names[k]]),'launch'):''),op==='rename'?'保存':'创建',v=>{let n=v.name.trim();if(s.ws.some((item,i)=>item.name===n&&(op!=='rename'||i!==s.active))){message('此工作区名称已存在');return false}if(op==='rename')w.name=n;else{s.ws.push({name:n,root:op==='copy'?structuredClone(w.root):leaf(v.kind)});s.active=s.ws.length-1}page=''})}
function switchWs(i){S().active=i;go('')}
function go(p){page=p;if(innerWidth<=760)hidden=true;draw()}
function draw(){let s=S(),w=W();document.body.dataset.mode=mode;let side=$('side');side.hidden=$('sidegrip').hidden=hidden;
let work='<div class="legend">工作区'+ib('新建工作区',"workspace(\'new\')",'plus')+'</div>'+s.ws.map((w,i)=>btn(w.name,'switchWs('+i+')','space','navrow '+(!page&&i===s.active?'sel':''))).join('');
let services=['gear','jobs','settings'].map(k=>btn(names[k],"go('"+k+"')",k,'navrow '+(page===k?'sel':''))).join('');
side.innerHTML='<div class="brand">'+icon('brand')+'Workbench</div>'+work+'<div class="bottom">'+services+'<div class="foot" role="group" aria-label="界面设计方案">'+modes.map((m,i)=>'<button title="'+m+'" aria-label="'+m+'" aria-pressed="'+(mode===i)+'" class="sample sample'+i+'" onclick="setMode('+i+')"><i></i></button>').join('')+'<small id="skinName">'+modes[mode]+'</small></div></div>';
$('bar').innerHTML=ib(hidden?'展开侧边栏':'收起侧边栏','toggleSide()','space')+'<i class="divider"></i><h1>'+esc(page?names[page]:w?.name||'工作区')+'</h1><div class="tools">'+(page?btn('返回工作区',"go('')",'back'):w?btn('添加窗格','addPane(this)','split')+ib('工作区操作','wsMenu(this)','more'):'')+'</div>';
$('surface').innerHTML=page?manager():w?'<div class="tree">'+tree(w.root)+'</div>':'<section class="manage"><h2>建立你的工作区</h2>'+btn('新建工作区',"workspace('new')",'plus')+'</section>';bindHandles()}
function setMode(i){mode=i;document.body.dataset.mode=i;history.replaceState(null,'',hashes[i]);$('skinName').textContent=modes[i];document.querySelectorAll('.sample').forEach((b,j)=>b.setAttribute('aria-pressed',i===j))}
function jump(id){go('');let p=$('p'+id);p.scrollIntoView({block:'nearest'});p.querySelector('button').focus()}
function wsMenu(el){popup(el,[['重命名',()=>workspace('rename')],['复制工作区',()=>workspace('copy')],['新建工作区',()=>workspace('new')],['导出布局',()=>transfer(false)],['导入布局',()=>transfer(true)],['删除工作区',()=>workspace('delete')]])}
function transfer(importing){
  if(!importing){const payload={version:1,name:W().name,layout:W().root};modal('导出布局','<label>布局 JSON<textarea readonly rows="10">'+esc(JSON.stringify(payload,null,2))+'</textarea></label>');$('form').querySelector('textarea').select();return}
  modal('导入布局','<label>粘贴布局 JSON<textarea required name="json" rows="8"></textarea></label>','创建工作区',v=>{
    try{const data=JSON.parse(v.json);if(data.version!==1||typeof data.name!=='string'||!data.name.trim())throw Error();
      const unpack=(n,depth)=>{if(!n||depth>12)throw Error();if(n.axis){if(!['x','y'].includes(n.axis)||!Number.isFinite(n.r))throw Error();return branch(n.axis,unpack(n.left,depth+1),unpack(n.right,depth+1),Math.max(15,Math.min(85,n.r)))}
        if(!['todo','launch','cal','empty'].includes(n.kind))throw Error();let x=leaf(n.kind);if(/^\d{4}-\d{2}-\d{2}$/.test(n.date)&&Number.isFinite(dateObj(n.date).valueOf()))x.date=n.date;if(['day','list','month'].includes(n.view))x.view=n.view;if(S().lists.includes(n.filter))x.filter=n.filter;return x};
      let root=unpack(data.layout,0),base=data.name.trim()+' 导入',name=base,i=2;while(S().ws.some(w=>w.name===name))name=base+' '+i++;S().ws.push({name,root});S().active=S().ws.length-1;page='';
    }catch{message('布局格式无效，请检查版本、插件和窗格结构');return false}
  })
}
function choice(title,callback){modal(title,pick('插件视图','kind',[...installed(),'empty'].map(k=>[k,names[k]]),installed()[0]||'empty'),'打开',v=>callback(v.kind))}
function addPane(el){popup(el,[['在工作区右侧添加',()=>choice('添加右侧窗格',k=>W().root=branch('x',W().root,leaf(k)))],['在工作区下方添加',()=>choice('添加下方窗格',k=>W().root=branch('y',W().root,leaf(k)))]] )}
function paneMenu(el,id){popup(el,[['左右切分',()=>choice('在右侧打开',k=>modify(id,n=>branch('x',n,leaf(k))))],['上下切分',()=>choice('在下方打开',k=>modify(id,n=>branch('y',n,leaf(k))))],['替换插件视图',()=>choice('替换当前窗格',k=>modify(id,()=>leaf(k)))],['关闭窗格',()=>modify(id,()=>null)]])}
function tree(n){if(n.axis)return '<div class="branch '+n.axis+'" style="--a:'+n.r+'fr;--b:'+(100-n.r)+'fr">'+tree(n.left)+'<div class="handle '+n.axis+'" data-id="'+n.id+'"></div>'+tree(n.right)+'</div>';let k=n.kind;
return '<section id="p'+n.id+'" class="pane '+k+'"><div class="panehead">'+icon(paths[k]?k:'pane')+names[k]+ib('窗格操作','paneMenu(this,'+n.id+')','more')+'</div><div class="content">'+(k==='empty'?'<h2>选择插件</h2>'+installed().map(p=>btn(names[p],"modify("+n.id+",()=>leaf('"+p+"'))",p)).join(''):!S().enabled[k]?'<h2>插件已停用</h2>'+btn('打开插件管理',"go('gear')"):k==='cal'?calendar(n):k==='todo'?todo(n):launcher(n))+'</div></section>'}
function bindHandles(){for(const g of document.querySelectorAll('.handle')){let sidebar=g.id==='sidegrip',n=sidebar?null:find(W().root,+g.dataset.id),x=sidebar||n.axis==='x',lo=sidebar?150:15,hi=sidebar?Math.min(400,innerWidth*.38):85;
function value(){return sidebar?$('side').offsetWidth:n.r}function resize(raw){let v=Math.max(lo,Math.min(hi,raw));if(sidebar)document.body.style.setProperty('--sidebar',v+'px');else{n.r=v;g.parentNode.style.setProperty('--a',v+'fr');g.parentNode.style.setProperty('--b',(100-v)+'fr')}g.setAttribute('aria-valuenow',Math.round(v))}
g.setAttribute('role','separator');g.tabIndex=0;g.setAttribute('aria-label',sidebar?'调整侧边栏宽度':'调整窗格比例');g.setAttribute('aria-valuenow',Math.round(value()));g.setAttribute('aria-valuemin',lo);g.setAttribute('aria-valuemax',hi);g.setAttribute('aria-orientation',x?'vertical':'horizontal');let pos,start;g.onpointerdown=e=>{if(!e.isPrimary)return;start=value();pos=x?e.clientX:e.clientY;g.setPointerCapture(e.pointerId)};g.onpointermove=e=>{if(g.hasPointerCapture(e.pointerId)){const delta=(x?e.clientX:e.clientY)-pos;resize(start+(sidebar?delta:100*delta/((x?g.parentNode.clientWidth:g.parentNode.clientHeight)-6)))}};g.onkeydown=e=>{let a=x?['ArrowLeft','ArrowRight']:['ArrowUp','ArrowDown'];if(a.includes(e.key)){e.preventDefault();resize(value()+(a.indexOf(e.key)?1:-1)*(sidebar?8:3))}}}}
const dateObj=s=>new Date(s+'T12:00:00Z'),iso=d=>d.toISOString().slice(0,10),shift=(s,n)=>{let d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)},weekday=s=>(dateObj(s).getUTCDay()+6)%7;
function field(id,key,v){find(W().root,id)[key]=v;draw()}
function dateStep(n,step){if(n.view!=='month')return shift(n.date,step*7);let d=dateObj(n.date);d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+step);return iso(d)}
function minutes(t){return +t.slice(0,2)*60 + +t.slice(3)}
function calendar(n){let d=dateObj(n.date),month=n.view==='month',first=month?n.date.slice(0,8)+'01':shift(n.date,-weekday(n.date)),events=S().events,rows=events.map((e,i)=>({e,i})).filter(({e})=>e[0]===n.date).sort((a,b)=>a.e[1].localeCompare(b.e[1])),days=month?new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate():7;
let dates=Array.from({length:days},(_,i)=>{let v=shift(first,i);return '<button class="'+(v===n.date?'selected':'')+'" aria-label="'+v+'" aria-pressed="'+(v===n.date)+'" onclick="field('+n.id+',\'date\',\''+v+'\')">'+(month?'':'<small>周'+'一二三四五六日'[weekday(v)]+'</small>')+'<b>'+dateObj(v).getUTCDate()+'</b>'+(month&&events.some(e=>e[0]===v)?'<i class="dot"></i>':'')+'</button>'}).join('');
let list=rows.map(({e,i})=>'<button class="event" onclick="eventForm('+n.id+','+i+')"><time>'+e[1]+'</time><span><b>'+esc(e[3])+'</b><small>'+esc(e[4])+'</small></span></button>').join('');
let start=Math.min(9,...rows.map(({e})=>Math.floor(minutes(e[1])/60))),end=Math.max(16,...rows.map(({e})=>Math.ceil(minutes(e[2])/60))),colors=[['#f5e4de','#b46a50'],['#e5eddf','#729363'],['#e3ebf6','#6488ae']];
function timeline(){let cols=[],items=rows.map(({e,i})=>{let col=cols.findIndex(end=>end<=e[1]);if(col<0)col=cols.length;cols[col]=e[2];return {e,i,col}});return '<div class="timeline"><div class="hours" style="height:'+(end-start)*60+'px">'+Array.from({length:end-start},(_,i)=>'<span style="top:'+i*60+'px">'+String(start+i).padStart(2,'0')+':00</span>').join('')+'</div><div class="slots" style="height:'+(end-start)*60+'px">'+items.map(({e,i,col})=>{let [t,c]=colors[i%3],width=100/cols.length;return '<button class="appointment" style="left:'+col*width+'%;width:calc('+width+'% - 3px);top:'+(minutes(e[1])-start*60)+'px;height:'+Math.max(15,minutes(e[2])-minutes(e[1])-2)+'px;--t:'+t+';--ec:'+c+'" onclick="eventForm('+n.id+','+i+')"><b>'+esc(e[3])+'</b><small>'+e[1]+'–'+e[2]+'　'+esc(e[4])+'</small></button>'}).join('')+'</div></div>'}
let title=month?d.getUTCFullYear()+' 年 '+(d.getUTCMonth()+1)+' 月':(d.getUTCMonth()+1)+' 月 '+d.getUTCDate()+' 日';
return '<div class="line"><h2>'+title+'</h2>'+ib('新建日程','eventForm('+n.id+')','plus')+'</div><div class="menuline"><div>'+ib('上一页',"field("+n.id+",'date','"+dateStep(n,-1)+"')",'back')+btn('今天',"field("+n.id+",'date','"+today+"')")+ib('下一页',"field("+n.id+",'date','"+dateStep(n,1)+"')",'next')+'</div><select aria-label="日程视图" onchange="field('+n.id+',\'view\',this.value)">'+[['day','时间表'],['list','日列表'],['month','月历']].map(([v,t])=>'<option value="'+v+'" '+(v===n.view?'selected':'')+'>'+t+'</option>').join('')+'</select></div><div class="'+(month?'month':'strip')+'">'+(month?[...'一二三四五六日'].map(k=>'<small>'+k+'</small>').join('')+'<i></i>'.repeat(weekday(first)):'')+dates+'</div><div class="agenda">'+(rows.length?(n.view==='day'?timeline():list):'<p class="empty">当天暂无日程</p>')+'</div>'}
function deleteButton(label,action){return '<button type="button" class="danger" onclick="'+action+'">'+label+'</button>'}
function removeRecord(group,i){modal('确认删除','<p>删除后，此项目会从所有工作区的对应插件中移除。</p>','删除',()=>S()[group].splice(i,1))}
function eventForm(id,i){let n=find(W().root,id),e=S().events[i]||[n.date,'09:00','10:00','',''];modal(i==null?'新建日程':'编辑日程',input('标题','title',e[3])+input('日期','date',e[0],'date')+input('开始','start',e[1],'time')+input('结束','end',e[2],'time')+'<label>地点<input name="place" value="'+esc(e[4])+'"></label>'+(i!=null?deleteButton('删除日程','removeRecord(\'events\','+i+')'):''),'保存',v=>{if(v.end<=v.start){message('结束时间须晚于开始时间');return false}let row=[v.date,v.start,v.end,v.title.trim(),v.place.trim()];S().events[i??S().events.length]=row;n.date=v.date})}
function todo(n){let s=S(),rows=s.tasks.map((t,i)=>({t,i})).filter(({t})=>n.filter==='全部'||t[1]===n.filter);
return '<div class="line"><h2>'+(n.filter==='全部'?'我的待办':esc(n.filter))+'</h2>'+ib('新建待办','taskForm('+n.id+')','plus')+'</div><div class="menuline"><span class="count">'+rows.filter(({t})=>!t[2]).length+' 项待完成</span><select aria-label="选择清单" onchange="field('+n.id+',\'filter\',this.value)">'+['全部',...s.lists].map(l=>'<option '+(n.filter===l?'selected':'')+'>'+esc(l)+'</option>').join('')+'</select></div>'+s.lists.filter(l=>n.filter==='全部'||l===n.filter).map(l=>'<h3 class="category">'+esc(l)+'</h3>'+ (rows.filter(({t})=>t[1]===l).map(({t,i})=>'<div class="task '+(t[2]?'completed':'')+'"><button class="mark" aria-label="'+(t[2]?'恢复':'完成')+esc(t[0])+'" aria-pressed="'+t[2]+'" onclick="toggleTask(this,'+i+')"><span class="circle">'+(t[2]?'✓':'')+'</span></button>'+btn(t[0],'taskForm('+n.id+','+i+')','','label')+'</div>').join('')||'<small>暂无待办</small>')).join('')+btn('新建清单','newList('+n.id+')','plus')}
function toggleTask(el,i){let id=el.closest('section').id;S().tasks[i][2]=!S().tasks[i][2];draw();$(id).querySelector('[onclick="toggleTask(this,'+i+')"]').focus({preventScroll:true})}
function newList(id){modal('新建清单',input('名称','name'),'创建',v=>{let name=v.name.trim();if(['全部',...S().lists].includes(name)){message('名称已被使用');return false}S().lists.push(name);find(W().root,id).filter=name})}
function taskForm(id,i){let n=find(W().root,id),t=S().tasks[i]||['',n.filter==='全部'?S().lists[0]:n.filter,false];modal(i==null?'新建待办':'编辑待办',input('标题','title',t[0])+pick('清单','list',S().lists.map(l=>[l,l]),t[1])+(i!=null?deleteButton('删除待办',"removeRecord('tasks',"+i+")"):''),'保存',v=>{S().tasks[i??S().tasks.length]=[v.title.trim(),v.list,t[2]]})}
function launcher(n){return '<div class="line"><h2>常用位置</h2>'+ib('添加入口','pinForm()','plus')+'</div><div class="tiles">'+S().pins.map(([name,kind],i)=>'<button class="tile" onclick="pinOpen('+i+')">'+icon(kind==='应用'?'app':'folder')+'<b>'+esc(name)+'</b><small>'+kind+'</small></button>').join('')+'</div><h3 class="category">插件</h3>'+installed().filter(k=>k!=='launch').map(k=>'<div class="pluginrow">'+icon(k)+'<b>'+names[k]+'</b>'+btn('在旁边打开',"modify("+n.id+",n=>branch('x',n,leaf('"+k+"')))","split")+'</div>').join('')}
function pinForm(){modal('添加快捷入口',pick('类型','kind',[['文件夹','文件夹'],['应用','应用']],'文件夹')+input('名称','name'),'固定入口',v=>S().pins.push([v.name.trim(),v.kind]))}
function pinOpen(i){let [n,k]=S().pins[i];modal(n,'<p>'+k+'启动预览</p><p class="muted">系统打开请求仅在原生应用中执行。</p>'+deleteButton('移除固定入口',"removeRecord('pins',"+i+")"))}
function manager(){let s=S(),body='';if(page==='gear'){body='<h3>随包插件</h3>'+Object.entries(s.enabled).map(([k,on])=>'<div class="pluginrow">'+icon(k)+'<b>'+names[k]+'</b><small>'+(on?'已启用':'已停用')+'</small>'+btn(on?'停用':'启用',"enablePlugin('"+k+"')")+'</div>').join('')+'<h3 class="category">工作台备份</h3>'+btn('创建样稿快照','snapshot()','plus')+snaps.map((b,i)=>'<div class="pluginrow">'+icon('clock')+esc(b.label)+btn('恢复','restore('+i+')')+'</div>').join('')}
if(page==='jobs')body=s.jobs.map((j,i)=>'<div class="pluginrow">'+icon('jobs')+'<b>'+esc(j.name)+'</b><small>'+j.state+'</small>'+(j.state==='等待中'?btn('取消任务','cancelJob('+i+')'):'')+'</div>').join('');
if(page==='settings')body='<h3>桌面行为</h3>'+[['login','登录时在后台启动'],['tray','显示菜单栏图标']].map(([k,title])=>'<div class="pluginrow">'+title+'<button role="switch" aria-checked="'+s.settings[k]+'" onclick="S().settings.'+k+'=!S().settings.'+k+';draw()">'+(s.settings[k]?'已开启':'已关闭')+'</button></div>').join('')+'<div class="pluginrow">唤出工作台'+btn(s.settings.keys,'shortcut()')+'</div>';
return '<section class="manage"><h2>'+names[page]+'</h2>'+body+'</section>'}
function enablePlugin(k){S().enabled[k]=!S().enabled[k];draw()}
function snapshot(){snaps.push({label:new Date().toLocaleTimeString('zh-CN')+'　'+S().ws.length+' 个工作区',data:structuredClone(S())});draw();message('已创建样稿快照')}
function restore(i){modal('恢复样稿快照','<p>将恢复当前工作区布局、插件数据及设置。恢复前会保留当前快照。</p>','恢复',()=>{snapshot();state=structuredClone(snaps[i].data)})}
function cancelJob(i){modal('取消后台任务','<p>确认取消「'+esc(S().jobs[i].name)+'」？</p>','取消任务',()=>S().jobs[i].state='已取消')}
function shortcut(){modal('唤出快捷键',pick('组合键','keys',['⌥ 空格','⌃ ⌥ W','未设置'].map(k=>[k,k]),S().settings.keys),'保存',v=>S().settings.keys=v.keys)}
function toggleSide(){hidden=!hidden;draw()}
draw();
</script></body></html>

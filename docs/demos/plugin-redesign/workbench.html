<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>日常工作 · OhMyWorkbench 组合评审稿</title>
  <style>
* { box-sizing: border-box; }
:root {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  color: #1d1d1f;
  background: #ececef;
  font-synthesis: none;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --blue: #007aff;
  --red: #ff3b30;
  --orange: #ff9500;
  --green: #28a745;
  --purple: #af52de;
  --canvas: #e9e9ec;
  --sidebar: #f2f2f4;
  --surface: #ffffff;
  --surface-2: #f6f6f8;
  --surface-3: #ededf0;
  --text: #1d1d1f;
  --secondary: #6e6e73;
  --tertiary: #737379;
  --line: rgba(60, 60, 67, 0.14);
  --line-strong: rgba(60, 60, 67, 0.22);
  --selection: rgba(0, 122, 255, 0.12);
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.16), 0 2px 8px rgba(0, 0, 0, 0.08);
}
html, body { margin: 0; width: 100%; min-height: 100%; }
body { color: var(--text); background: var(--canvas); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button, select { cursor: pointer; }
button { border: 0; padding: 0; background: none; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--blue) 65%, transparent);
  outline-offset: 2px;
}
button:disabled { opacity: 0.4; cursor: default; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, h4, p { margin: 0; }
ul { list-style: none; padding: 0; margin: 0; }
svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
.icon { display: inline-grid; place-items: center; flex: none; }
.icon svg { display: block; }
.muted { color: var(--secondary); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* Host */
.workbench { height: 100%; display: flex; overflow: hidden; background: var(--canvas); color: var(--text); }
.host-sidebar {
  width: 216px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: 0 11px 12px;
  background: color-mix(in srgb, var(--sidebar) 94%, transparent);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.traffic-lights { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 8px; flex: none; }
.traffic-lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 0.5px rgba(0,0,0,.12); }
.traffic-lights i:nth-child(2) { background: #febc2e; }
.traffic-lights i:nth-child(3) { background: #28c840; }
.host-brand { display: flex; align-items: center; gap: 9px; padding: 6px 9px 23px; font-size: 15px; font-weight: 670; letter-spacing: -0.02em; }
.host-brand .app-mark { width: 28px; height: 28px; display: grid; place-items: center; color: white; border-radius: 8px; background: linear-gradient(145deg, #0a84ff, #0060df); box-shadow: inset 0 0.5px 0.5px rgba(255,255,255,.45); }
.host-brand .app-mark svg { width: 17px; height: 17px; stroke-width: 1.8; }
.nav-section-label { display: flex; align-items: center; justify-content: space-between; min-height: 28px; padding: 0 8px; color: var(--secondary); font-size: 11px; font-weight: 600; }
.nav-section-label button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; }
.nav-section-label button:hover { background: var(--surface-3); }
.nav-section-label svg { width: 14px; height: 14px; }
.workspace-list { display: grid; gap: 2px; }
.workspace-item { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 35px; padding: 6px 9px; text-align: left; border-radius: 7px; color: var(--text); transition: background-color 120ms ease; }
.workspace-item svg { width: 16px; height: 16px; color: var(--secondary); }
.workspace-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.workspace-item:hover { background: color-mix(in srgb, var(--surface-3) 60%, transparent); }
.workspace-item[aria-current="page"] { background: var(--surface-3); font-weight: 580; }
.workspace-item[aria-current="page"] svg { color: var(--blue); }
.sidebar-spacer { flex: 1; min-height: 24px; }
.host-services { padding-top: 10px; border-top: 1px solid var(--line); }
.local-status { display: flex; align-items: center; gap: 7px; color: var(--secondary); font-size: 11px; padding: 13px 9px 0; }
.local-status i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.sidebar-resize { width: 5px; margin-left: -3px; z-index: 5; cursor: col-resize; touch-action: none; position: relative; }
.sidebar-resize::after { content: ""; position: absolute; inset: 0 2px; background: transparent; transition: background-color 120ms ease; }
.sidebar-resize:hover::after, .sidebar-resize:focus-visible::after, .sidebar-resize[data-dragging="true"]::after { background: color-mix(in srgb, var(--blue) 45%, transparent); }
.host-main { min-width: 0; min-height: 0; flex: 1; display: flex; flex-direction: column; }
.host-toolbar { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 17px; background: color-mix(in srgb, var(--surface) 94%, transparent); border-bottom: 1px solid var(--line); flex: none; }
.host-title { min-width: 0; }
.host-title h1 { font-size: 16px; line-height: 1.25; font-weight: 650; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-state { color: var(--tertiary); font-size: 10px; }
.host-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.host-button, .icon-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 29px; height: 29px; padding: 0 7px; border-radius: 6px; color: var(--secondary); transition: color 120ms ease, background-color 120ms ease, transform 120ms var(--ease-out); }
.host-button { border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 12px; }
.host-button:hover, .icon-button:hover { background: var(--surface-3); color: var(--text); }
.host-button:active, .icon-button:active, .primary-button:active, .tile:active { transform: scale(0.97); }
.host-button svg, .icon-button svg { width: 16px; height: 16px; }
.sidebar-toggle { display: none; }
.workspace-tree { flex: 1; min-height: 0; min-width: 0; padding: 8px; overflow: hidden; }

/* Recursive pane layout */
.split { display: grid; width: 100%; height: 100%; min-width: 0; min-height: 0; }
.split.x { grid-template-columns: minmax(0, var(--ratio)) 8px minmax(0, calc(100% - var(--ratio) - 8px)); }
.split.y { grid-template-rows: minmax(0, var(--ratio)) 8px minmax(0, calc(100% - var(--ratio) - 8px)); grid-template-columns: minmax(0, 1fr); }
.split > .pane, .split > .split { min-width: 0; min-height: 0; }
.divider { position: relative; z-index: 4; touch-action: none; background: transparent; }
.divider.x { cursor: col-resize; }
.divider.y { cursor: row-resize; }
.divider::before { content: ""; position: absolute; background: var(--line-strong); opacity: 0; transition: opacity 120ms ease, background-color 120ms ease; }
.divider.x::before { inset: 10px 3px; border-radius: 2px; }
.divider.y::before { inset: 3px 10px; border-radius: 2px; }
.divider:hover::before, .divider:focus-visible::before, .divider[data-dragging="true"]::before { opacity: 1; background: var(--blue); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; container-type: inline-size; }
.pane-chrome { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 9px 0 12px; color: var(--secondary); background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 6; }
.pane-identity { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 12px; }
.pane-identity strong { color: var(--text); font-weight: 590; white-space: nowrap; }
.pane-identity .icon svg { width: 15px; height: 15px; }
.pane-calendar > .pane-chrome .pane-identity .icon { color: var(--red); }
.pane-todo > .pane-chrome .pane-identity .icon { color: var(--blue); }
.pane-launcher > .pane-chrome .pane-identity .icon { color: var(--orange); }
.pane-actions { display: flex; align-items: center; gap: 1px; margin-left: auto; }
.pane-actions .icon-button { min-width: 25px; width: 25px; height: 25px; padding: 0; }
.pane-actions .icon-button svg { width: 14px; height: 14px; }
.pane-body { flex: 1; min-height: 0; min-width: 0; overflow: auto; position: relative; }
.pane.is-zoomed { position: absolute; inset: 8px; z-index: 12; box-shadow: var(--shadow); }
.empty-pane { min-height: 100%; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; }
.empty-pane h2 { font-size: 19px; letter-spacing: -0.02em; }
.empty-pane p { color: var(--secondary); font-size: 12px; }
.empty-choices { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
.empty-choices button { display: flex; align-items: center; gap: 7px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }

/* Shared controls */
.primary-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 30px; padding: 5px 13px; border-radius: 7px; color: #fff; background: var(--blue); font-size: 12px; font-weight: 570; transition: background-color 120ms ease, transform 120ms var(--ease-out); }
.primary-button:hover { background: color-mix(in srgb, var(--blue) 88%, #000); }
.secondary-button { display: inline-flex; align-items: center; justify-content: center; min-height: 30px; padding: 5px 13px; border-radius: 7px; background: var(--surface-3); font-size: 12px; }
.text-button { color: var(--blue); font-size: 12px; padding: 4px; border-radius: 4px; }
.segmented { display: inline-flex; align-items: center; padding: 2px; border-radius: 7px; background: var(--surface-3); }
.segmented button { min-width: 35px; min-height: 24px; padding: 2px 8px; border-radius: 5px; color: var(--secondary); font-size: 11px; transition: color 120ms ease, background-color 120ms ease, box-shadow 120ms ease; }
.segmented button[aria-pressed="true"] { color: var(--text); background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 580; }
.plugin-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.plugin-toolbar .toolbar-end { margin-left: auto; display: flex; align-items: center; gap: 5px; }
.date-navigation { display: flex; align-items: center; gap: 2px; }
.date-navigation button { min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 5px; color: var(--secondary); font-size: 11px; }
.date-navigation button:hover { color: var(--text); background: var(--surface-3); }
.date-navigation svg { width: 14px; height: 14px; }
.date-heading h2 { font-size: 22px; line-height: 1.15; letter-spacing: -0.035em; font-weight: 680; }
.date-heading p { color: var(--red); font-size: 11px; font-weight: 600; }
.badge { display: inline-flex; align-items: center; min-height: 18px; padding: 1px 6px; border-radius: 5px; background: var(--surface-3); color: var(--secondary); font-size: 10px; white-space: nowrap; }
.badge.today { color: var(--red); background: color-mix(in srgb, var(--red) 10%, transparent); }
.quick-add { display: flex; align-items: center; gap: 7px; }
.quick-add input { min-width: 0; flex: 1; height: 32px; padding: 5px 9px; border: 1px solid transparent; border-radius: 7px; background: var(--surface-2); outline: none; }
.quick-add input:focus { border-color: color-mix(in srgb, var(--blue) 55%, transparent); background: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 10%, transparent); }
.quick-add button { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; background: var(--blue); color: white; }
.quick-add button svg { width: 15px; height: 15px; }

/* A: Calendar time grid */
.calendar-native { min-height: 100%; display: flex; flex-direction: column; }
.calendar-native > .plugin-toolbar { padding: 15px 17px 10px; }
.calendar-native .date-heading { margin-right: auto; }
.week-strip { display: grid; grid-template-columns: 49px minmax(0, 1fr); padding: 0 12px 8px 5px; border-bottom: 1px solid var(--line); }
.week-strip::before { content: ""; }
.day-select { display: grid; justify-items: center; gap: 2px; padding: 4px 2px; border-radius: 7px; color: var(--secondary); }
.day-select small { font-size: 10px; }
.day-select b { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 50%; color: var(--text); font-size: 13px; font-weight: 540; font-variant-numeric: tabular-nums; }
.day-select[aria-current="date"] b { color: white; background: var(--red); }
.day-select:hover { background: var(--surface-2); }
.all-day-row { display: grid; grid-template-columns: 49px minmax(0, 1fr); min-height: 27px; padding: 3px 12px 3px 5px; border-bottom: 1px solid var(--line); }
.all-day-row > span { color: var(--tertiary); font-size: 9px; text-align: right; padding: 3px 7px 0 0; }
.all-day-event { margin: 0 3px; padding: 2px 6px; overflow: hidden; border-radius: 4px; color: color-mix(in srgb, var(--event) 72%, var(--text)); background: color-mix(in srgb, var(--event) 15%, var(--surface)); font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
.time-scroll { flex: 1; min-height: 360px; overflow: auto; }
.time-grid { --hour: 62px; display: grid; grid-template-columns: 49px minmax(0, 1fr); height: calc(var(--hour) * 12); min-height: 620px; padding: 0 12px 0 5px; }
.calendar-clip { min-width: 0; overflow: clip; }
.calendar-track { display: flex; height: 100%; }
.calendar-page { display: grid; flex: 0 0 100%; min-width: 0; grid-template-columns: repeat(var(--days), minmax(0, 1fr)); }
.calendar-track > [data-before] { margin-left: -100%; }
.calendar-native { touch-action: pan-y pinch-zoom; }
.calendar-native[data-panning] { user-select: none; cursor: grabbing; }
.time-axis { position: relative; }
.time-axis span { position: absolute; right: 8px; transform: translateY(-50%); color: var(--tertiary); font-size: 9px; font-variant-numeric: tabular-nums; }
.time-axis span:first-child { transform: none; }
.day-column { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hour)); background-position: 0 0; }
.day-column.is-today { background-color: color-mix(in srgb, var(--red) 2%, transparent); }
.time-event { position: absolute; z-index: 1; overflow: hidden; padding: 4px 6px; text-align: left; border-radius: 5px; color: color-mix(in srgb, var(--event) 70%, var(--text)); background: color-mix(in srgb, var(--event) 15%, var(--surface)); border-left: 3px solid var(--event); box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--event) 15%, transparent); transition: filter 120ms ease, box-shadow 120ms ease; }
.time-event:hover { filter: brightness(0.98); box-shadow: 0 2px 8px color-mix(in srgb, var(--event) 18%, transparent); z-index: 2; }
.time-event strong { display: block; font-size: 11px; line-height: 1.3; font-weight: 620; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.time-event small { display: block; margin-top: 2px; font-size: 9px; line-height: 1.25; opacity: 0.82; font-variant-numeric: tabular-nums; }
.time-event.is-short { padding-top: 2px; }
.time-event.is-short small { display: none; }

.compact-event { width: 100%; display: flex; align-items: center; gap: 9px; padding: 7px 0; text-align: left; border-bottom: 1px solid var(--line); }
.compact-event > i { width: 3px; height: 29px; border-radius: 2px; background: var(--event); }
.compact-event time { width: 39px; color: var(--secondary); font-size: 10px; font-variant-numeric: tabular-nums; }
.compact-event span { min-width: 0; }
.compact-event strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; font-weight: 580; }
.compact-event small { display: block; color: var(--secondary); font-size: 9px; }

/* Reminders */
.todo-view { min-height: 100%; display: flex; flex-direction: column; padding: 14px 15px 18px; }
.todo-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.todo-heading h2 { color: var(--blue); font-size: 25px; line-height: 1.1; letter-spacing: -0.045em; font-weight: 700; }
.todo-heading .count { color: var(--secondary); font-size: 11px; }
.todo-heading .icon-button { margin-left: auto; color: var(--blue); }
.todo-filters { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
.todo-filters button { flex: none; padding: 4px 8px; border-radius: 6px; color: var(--secondary); font-size: 10px; }
.todo-filters button[aria-pressed="true"] { color: var(--blue); background: color-mix(in srgb, var(--blue) 10%, transparent); font-weight: 600; }
.todo-view > .quick-add { margin-bottom: 10px; }
.todo-group-title { display: flex; align-items: center; justify-content: space-between; margin: 13px 1px 3px; color: var(--secondary); font-size: 10px; font-weight: 600; }
.todo-row { position: relative; display: grid; grid-template-columns: 27px minmax(0, 1fr) auto; align-items: start; gap: 5px; min-height: 43px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.check-button { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; color: white; }
.check-circle { width: 19px; height: 19px; display: grid; place-items: center; border: 1.5px solid color-mix(in srgb, var(--blue) 50%, var(--line-strong)); border-radius: 50%; transition: background-color 150ms ease, border-color 150ms ease, transform 120ms var(--ease-out); }
.check-button:active .check-circle { transform: scale(0.88); }
.todo-row.is-complete .check-circle { background: var(--blue); border-color: var(--blue); }
.check-circle svg { width: 12px; height: 12px; stroke-width: 2.4; opacity: 0; }
.todo-row.is-complete .check-circle svg { opacity: 1; }
.todo-title { min-width: 0; display: block; padding: 1px 0; text-align: left; }
.todo-title strong { display: block; font-size: 12px; line-height: 1.4; font-weight: 480; overflow-wrap: anywhere; }
.todo-title small { display: flex; align-items: center; gap: 5px; margin-top: 2px; color: var(--secondary); font-size: 9px; }
.todo-row.is-complete .todo-title strong { color: var(--tertiary); text-decoration: line-through; }
.priority-flag { color: var(--orange); font-size: 10px; padding-top: 4px; }
.todo-row .row-more { width: 24px; height: 24px; display: grid; place-items: center; color: var(--tertiary); border-radius: 5px; opacity: 0; }
.todo-row:hover .row-more, .todo-row:focus-within .row-more { opacity: 1; }
.todo-empty { padding: 28px 8px; color: var(--secondary); text-align: center; font-size: 12px; }
.inline-detail { grid-column: 2 / -1; display: grid; gap: 9px; padding: 9px 0 12px; }
.inline-detail label { display: grid; gap: 3px; color: var(--secondary); font-size: 10px; }
.inline-detail input, .inline-detail textarea, .inline-detail select, .dialog-form input, .dialog-form textarea, .dialog-form select { width: 100%; min-height: 31px; padding: 5px 8px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); outline: none; }
.inline-detail textarea, .dialog-form textarea { min-height: 64px; resize: vertical; }
.inline-detail input:focus, .inline-detail textarea:focus, .inline-detail select:focus, .dialog-form input:focus, .dialog-form textarea:focus, .dialog-form select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 12%, transparent); }
.inline-detail .form-actions { display: flex; justify-content: flex-end; gap: 7px; }

/* Launcher */
.launcher-view { min-height: 100%; padding: 16px; }
.launcher-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.launcher-heading h2 { font-size: 21px; line-height: 1.1; letter-spacing: -0.035em; }
.launcher-heading .icon-button { margin-left: auto; }
.launcher-section-title { margin: 18px 1px 8px; color: var(--secondary); font-size: 10px; font-weight: 600; }
.launch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap: 7px; }
.tile { min-width: 0; min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 9px 5px; border-radius: 9px; text-align: center; transition: background-color 120ms ease, transform 120ms var(--ease-out); }
.tile:hover { background: var(--surface-2); }
.tile-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 10px; color: var(--tile-color, var(--blue)); background: color-mix(in srgb, var(--tile-color, var(--blue)) 12%, var(--surface)); box-shadow: inset 0 0 0 0.5px color-mix(in srgb, var(--tile-color, var(--blue)) 10%, transparent); }
.tile-icon svg { width: 23px; height: 23px; stroke-width: 1.5; }
.tile span:last-child { max-width: 100%; font-size: 10px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.launch-list { display: grid; gap: 3px; }
.launch-list .tile { min-height: 54px; flex-direction: row; justify-content: flex-start; text-align: left; padding: 6px 8px; gap: 10px; }
.launch-list .tile-icon { width: 36px; height: 36px; border-radius: 9px; }
.launch-list .tile-icon svg { width: 20px; height: 20px; }
.launch-list .tile > span:last-child { font-size: 12px; -webkit-line-clamp: 1; }
.launcher-note { margin-top: 15px; color: var(--tertiary); font-size: 9px; text-align: center; }

.context-menu { position: fixed; z-index: 60; min-width: 190px; padding: 5px; border: 1px solid var(--line-strong); border-radius: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(22px) saturate(160%); box-shadow: var(--shadow); transform-origin: var(--menu-origin, top left); animation: menu-enter 160ms var(--ease-out); }
.context-menu .menu-label { padding: 6px 9px 5px; color: var(--tertiary); font-size: 10px; }

  let state = loadState();

  function treeKey() { return `${state.workspace}:${concept}`; }
  function tree() {
    if (!state.layouts[treeKey()]) state.layouts[treeKey()] = defaultLayout(concept, state.workspace);

  function setTree(next) { state.layouts[treeKey()] = next; save(); }
  function workspace() { return state.workspaces.find(item => item.id === state.workspace) || state.workspaces[0]; }

  function findNode(node, id) {
    if (!node) return null;

  function removeNode(node, id) {

  function leaves(node) { return node.axis ? [...leaves(node.a), ...leaves(node.b)] : [node]; }

  const dateObj = value => new Date(`${value}T12:00:00Z`);
  const iso = date => date.toISOString().slice(0, 10);
  function shift(value, amount, unit = 'days') {
    const date = dateObj(value);
    if (unit === 'months') { date.setUTCDate(1); date.setUTCMonth(date.getUTCMonth() + amount); }

  function monthLabel(value) { const d = dateObj(value); return `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月`; }

  function minutes(time) { return Number(time.slice(0, 2)) * 60 + Number(time.slice(3)); }
  function visibleEvents() { return state.events.filter(event => !state.hiddenCalendars.includes(event.calendar)); }
  function eventsFor(date) { return visibleEvents().filter(event => event.date === date).sort((a, b) => (a.start || '').localeCompare(b.start || '')); }

  function closeMenu(restoreFocus = false) {

  function openMenu(anchor, label, items) {

    overlay.append(menu);
    const rect = anchor.getBoundingClientRect();
    const width = menu.offsetWidth;
    const height = menu.offsetHeight;
    const left = Math.max(8, Math.min(innerWidth - width - 8, rect.right - width));
    const top = Math.max(8, Math.min(innerHeight - height - 8, rect.bottom + 5));
    menu.style.left = `${left}px`;
    menu.style.top = `${top}px`;

  function closeDialog() {

  function showDialog(title, body, options = {}) {

    dialog.innerHTML = `<div class="dialog-header"><h2 id="dialog-title">${esc(title)}</h2><button class="icon-button" type="button" data-close-dialog aria-label="关闭">${icon('close')}</button></div>${body}`;
    overlay.append(dialog);
    dialog.querySelectorAll('[data-close-dialog]').forEach(button => button.addEventListener('click', () => dialog.close()));

    dialog.querySelector('input:not([type="hidden"]), textarea, select')?.focus();

  }
  function confirmAction(title, message, confirmLabel, action) {

  function eventForm(event) {

  function openTask(id) {

  function paneHeader(node) {

  function calendarToolbar(days) {
    const selected = dateObj(state.selectedDate);
    return `<div class="plugin-toolbar">
      <div class="date-heading"><p>${monthLabel(state.selectedDate)}</p><h2>${selected.getUTCDate()}日 <span>${weekdayName(state.selectedDate)}</span></h2></div>

        <button type="button" data-action="calendar-prev" aria-label="向前${days}天">${icon('left')}</button><button type="button" data-action="calendar-today">今天</button><button type="button" data-action="calendar-next" aria-label="向后${days}天">${icon('right')}</button>
      </div><button class="icon-button plugin-add" type="button" data-action="new-event" aria-label="新建日程" title="新建日程">${icon('plus')}</button></div>
    </div>`;
  }
  function layoutEvents(events) {
    const sorted = events.filter(event => !event.allDay).sort((a, b) => a.start.localeCompare(b.start));
    const result = [];
    const lanesById = new Map();
    let cluster = [];
    let clusterEnd = -1;
    function finish() {
      if (!cluster.length) return;
      const laneEnds = [];
      for (const event of cluster) {
        let lane = laneEnds.findIndex(end => end <= minutes(event.start));
        if (lane < 0) { lane = laneEnds.length; laneEnds.push(0); }
        laneEnds[lane] = minutes(event.end);
        lanesById.set(event.id, lane);
      }
      for (const event of cluster) result.push({ event, lane: lanesById.get(event.id), lanes: laneEnds.length });
      cluster = [];
    }
    for (const event of sorted) {
      if (cluster.length && minutes(event.start) >= clusterEnd) finish();
      if (!cluster.length) clusterEnd = minutes(event.end);
      else clusterEnd = Math.max(clusterEnd, minutes(event.end));

    return result;
  }
  function calendarDaysFor(node) {

  }
  function visibleDates(selected, days) {

  }

  function calendarPage(dates, selected, firstHour) {
    const heading = dates.map(date => `<button type="button" class="day-select" data-action="select-date" data-date="${date}" aria-pressed="${date === selected}" ${date === TODAY ? 'aria-current="date"' : ''} aria-label="${fullDateLabel(date)}"><small>周${'一二三四五六日'[weekdayIndex(date)]}</small><b>${dateObj(date).getUTCDate()}</b></button>`).join('');
    const allDay = dates.map(date => `<div class="all-day-cell">${eventsFor(date).filter(event => event.allDay).map(event =>
      `<button type="button" class="all-day-event" style="--event:${event.color}" data-action="edit-event" data-id="${event.id}">${esc(event.title)}</button>`
    ).join('')}</div>`).join('');
    const times = dates.map(date => {
      const events = layoutEvents(eventsFor(date)).map(({ event, lane, lanes }) => {
          const top = (minutes(event.start) - firstHour * 60) / 60 * 62;
          const height = Math.max(18, (minutes(event.end) - minutes(event.start)) / 60 * 62 - 2);
          return `<button type="button" class="time-event ${height < 40 ? 'is-short' : ''}" style="--event:${event.color};top:${top}px;height:${height}px;left:calc(${lane / lanes * 100}% + 2px);width:calc(${100 / lanes}% - 5px)" data-action="edit-event" data-id="${event.id}" title="${esc(event.title)}，${event.start}–${event.end}"><strong>${esc(event.title)}</strong><small>${event.start}–${event.end}${height >= 52 && event.location ? `<br>${esc(event.location)}` : ''}</small></button>`;
      }).join('');
      return `<div class="day-column ${date === TODAY ? 'is-today' : ''}" data-date="${date}">${events}</div>`;
    }).join('');
    return [heading, allDay, times];
  }

  function renderCalendar(node) {
    const days = calendarDaysFor(node);
    const dates = visibleDates(state.selectedDate, days);
    const timed = dates.flatMap(eventsFor).filter(event => !event.allDay);
    const firstHour = Math.min(8, ...timed.map(event => Math.floor(minutes(event.start) / 60)));
    const endHour = Math.max(20, ...timed.map(event => Math.ceil(minutes(event.end) / 60)));
    const hours = Array.from({ length: endHour - firstHour }, (_, i) => firstHour + i);
    const [heading, allDay, times] = calendarPage(dates, state.selectedDate, firstHour).map(cells =>

    );
    return `<div class="calendar-native" style="--days:${days}" data-visible-days="${days}" data-first-hour="${firstHour}">

      <div class="week-strip">${heading}</div>

      </div></div>

  }

  function filteredTasks() {

  function taskGroup(task) {

  function renderTask(task) {

    return `<li class="todo-row ${task.completed ? 'is-complete' : ''}" data-task-id="${task.id}">
      <button type="button" class="check-button" data-action="toggle-task" data-id="${task.id}" aria-label="${task.completed ? '恢复' : '完成'}${esc(task.title)}" aria-pressed="${task.completed}"><span class="check-circle">${icon('check')}</span></button>

      ${flag ? `<span class="priority-flag" aria-label="${{high:'高',medium:'中',low:'低'}[task.priority]}优先级">${flag}</span>` : `<button type="button" class="row-more" data-action="task-menu" data-id="${task.id}" aria-label="${esc(task.title)}的操作">${icon('more')}</button>`}

    </li>`;

  function renderTodo(node) {

      const name = taskGroup(task);

    const remaining = state.tasks.filter(task => !task.completed).length;
    const composing = transient.newTaskPane === node.id;
    return `<div class="todo-view">
      <div class="todo-heading"><h2>待办</h2><span class="count">${remaining} 项</span><button class="icon-button plugin-add" type="button" data-action="focus-new-task" data-id="${node.id}" aria-label="${composing ? '取消新建待办' : '新建待办'}" aria-expanded="${composing}">${icon(composing ? 'close' : 'plus')}</button></div>
      <div class="todo-filters" aria-label="待办筛选">${[['open','待完成'],['today','今天'],['planned','计划内'],['completed','已完成']].map(([filter,label]) => `<button type="button" data-action="todo-filter" data-filter="${filter}" aria-pressed="${state.todoFilter === filter}">${label}</button>`).join('')}</div>
      ${composing ? `<form class="todo-composer" data-form="new-task" data-pane-id="${node.id}"><span class="new-task-marker" aria-hidden="true"></span><input name="title" required maxlength="160" aria-label="新待办名称" placeholder="待办事项" value="${esc(draftTitle)}" autocomplete="off"><button class="composer-submit" type="submit">添加</button></form>` : ''}
      <div class="todo-items">${tasks.length ? groups.map(group => `<section><h3 class="todo-group-title">${group}<span>${tasks.filter(task => taskGroup(task) === group).length}</span></h3><ul>${tasks.filter(task => taskGroup(task) === group).map(renderTask).join('')}</ul></section>`).join('') : `<p class="todo-empty">${state.todoFilter === 'completed' ? '还没有已完成事项。' : state.todoFilter === 'today' ? '今天没有到期事项。' : '这里暂时没有待办。'}</p>`}</div>
    </div>`;
  }

  function launcherIcon(item) {

  function pinnedPlugins() {

  function renderSidebar() {

  function renderToolbar() {
    return `<header class="host-toolbar"><div class="host-title"><h1>${esc(workspace().name)}</h1></div>
      <div class="host-actions"><button class="icon-button" type="button" data-action="workspace-menu" aria-label="工作区操作" title="工作区操作">${icon('more')}</button></div></header>`;
  }
  function render() {
    closeMenu();
    calendarDrag = null;
    stopCalendarPan();
    calendarResizeObserver?.disconnect();
    const current = transient.zoom ? findNode(tree(), transient.zoom) : null;
    if (transient.zoom && !current) transient.zoom = null;
    app.innerHTML = `<div class="workbench">${renderSidebar()}<section class="host-main">${renderToolbar()}<div class="workspace-tree">${renderTree(current || tree())}</div></section></div>`;

    bindDividers();
    bindSidebarResize();
    bindCalendarResize();

  function bindCalendarResize() {
    const bodies = [...app.querySelectorAll('.pane-calendar .pane-body')];
    if (!bodies.length) return;
    calendarResizeObserver = new ResizeObserver(entries => {
      for (const entry of entries) {
        const body = entry.target;
        if (!body.isConnected) continue;
        const pane = body.closest('[data-pane-id]');
        const id = pane?.dataset.paneId;
        const node = findNode(tree(), id);
        if (!node || node.kind !== 'calendar') continue;
        const days = entry.contentRect.width >= 760 ? 7 : entry.contentRect.width >= 600 ? 5 : entry.contentRect.width >= 440 ? 3 : 1;
        if (transient.calendarDaysByPane[id] === days) {
          if (calendarPan?.root.parentElement === body &&
              Math.abs(calendarPan.tracks[0].getBoundingClientRect().width - calendarPan.width) > 1) {
            calendarDrag = null;
            stopCalendarPan();
          }
          continue;
        }
        transient.calendarDaysByPane[id] = days;
        refreshCalendar(body, node);
      }
    });
    for (const body of bodies) calendarResizeObserver.observe(body);
  }

  function refreshCalendar(body, node) {
    const old = body.querySelector('.calendar-native');
    if (calendarDrag?.root === old) calendarDrag = null;
    if (calendarPan?.root === old) stopCalendarPan();
    const top = Number(old.dataset.firstHour) * 62 + old.querySelector('.time-scroll').scrollTop;
    body.innerHTML = renderCalendar(node);
    const calendar = body.firstElementChild;
    calendar.querySelector('.time-scroll').scrollTop = top - Number(calendar.dataset.firstHour) * 62;
  }

  function stopCalendarPan() {
    if (!calendarPan) return;
    const { root, tracks, frame, timer } = calendarPan;
    cancelAnimationFrame(frame);
    clearTimeout(timer);
    delete root.dataset.panning;
    for (const track of tracks) {
      track.style.removeProperty('transform');
      track.querySelectorAll('[inert]').forEach(page => page.remove());
    }
    calendarPan = null;
  }

  function beginCalendarPan(root) {
    if (calendarPan?.root === root) {
      clearTimeout(calendarPan.timer);
      if (calendarPan.frame) {
        cancelAnimationFrame(calendarPan.frame);
        calendarPan.frame = 0;
        calendarPan.lastTime = performance.now();
      }
      return calendarPan;
    }
    stopCalendarPan();
    const tracks = [...root.querySelectorAll('.calendar-track')];
    const width = tracks[0].getBoundingClientRect().width;
    if (width < 1) return null;
    const days = Number(root.dataset.visibleDays);
    for (const direction of [-1, 1]) {
      const selected = shift(state.selectedDate, direction * days);
      const page = calendarPage(visibleDates(selected, days), selected, Number(root.dataset.firstHour));
      tracks.forEach((track, i) => {
        const neighbor = document.createElement('div');
        neighbor.className = 'calendar-page';
        neighbor.inert = true;
        neighbor.innerHTML = page[i];
        if (direction < 0) { neighbor.dataset.before = ''; track.prepend(neighbor); }
        else track.append(neighbor);
      });
    }
    root.dataset.panning = '';
    calendarPan = { root, tracks, width, days, x: 0, velocity: 0, lastTime: performance.now(), frame: 0, timer: 0 };
    return calendarPan;
  }

  function paintCalendarPan(pan, x) {
    pan.x = x;
    for (const track of pan.tracks) track.style.transform = `translate3d(${x}px,0,0)`;
  }

  function moveCalendarPan(root, dx) {
    const pan = beginCalendarPan(root);
    if (!pan) return;
    const now = performance.now();
    // Only movement towards an edge meets resistance. Reversing is immediate.
    const limit = pan.width * .75, band = pan.width - limit;
    const outward = Math.sign(dx) === Math.sign(pan.x);
    let x = pan.x + dx;
    if (outward && Math.abs(pan.x) >= limit) {
      const remaining = (pan.width - Math.abs(pan.x)) * Math.exp(-Math.abs(dx) / band);
      x = Math.sign(dx) * (pan.width - remaining);
    } else if (Math.abs(x) > limit && Math.sign(x) === Math.sign(dx)) {
      x = Math.sign(dx) * (pan.width - band * Math.exp(-(Math.abs(x) - limit) / band));
    }
    const dt = Math.max(8, now - pan.lastTime);
    pan.velocity = dt > 90 ? 0 : .5 * pan.velocity + .5 * (x - pan.x) / dt;
    pan.lastTime = now;
    paintCalendarPan(pan, x);
  }

  function settleCalendarPan(cancelled = false) {
    const pan = calendarPan;
    if (!pan) return;
    clearTimeout(pan.timer);
    const width = pan.width;
    const velocity = pan.velocity * Math.exp(-(performance.now() - pan.lastTime) / 110);
    const projected = pan.x + Math.max(-width / 3, Math.min(width / 3, velocity * 120));
    const page = !cancelled && Math.abs(pan.x) > width * .08 && Math.abs(projected) > width * .35 ? Math.sign(projected) : 0;
    const target = page * width;
    const finish = () => {
      stopCalendarPan();
      if (!page) return;
      state.selectedDate = shift(state.selectedDate, -page * pan.days);
      save();
      // Keep the current vertical time and any focused editor in another plugin.
      for (const body of app.querySelectorAll('.pane-calendar .pane-body')) {

    const start = performance.now(), offset = pan.x - target, stiffness = .024;
    const tick = now => {
      const t = now - start;
      const remainder = (offset + (velocity + stiffness * offset) * t) * Math.exp(-stiffness * t);
      if ((Math.abs(remainder) < .3 && t > 64) || t > 440) { finish(); return; }
      paintCalendarPan(pan, Math.max(-width, Math.min(width, target + remainder)));
      pan.frame = requestAnimationFrame(tick);
    };
    pan.frame = requestAnimationFrame(tick);
  }

  // Trackpads and tilt wheels supply deltaX. Shift+wheel works with a vertical wheel.
  app.addEventListener('wheel', event => {
    const root = event.target.closest('.calendar-native');
    if (!root || event.ctrlKey || event.metaKey || calendarDrag?.claimed) return;
    const shifted = event.shiftKey && !event.deltaX;
    const delta = shifted ? event.deltaY : event.deltaX;
    if (!delta || (!shifted && Math.abs(delta) <= Math.abs(event.deltaY))) return;
    event.preventDefault();

    moveCalendarPan(root, -delta * unit);

  function splitPane(id, axis, kind = 'empty') {

  function newWorkspace() {

  function renameWorkspace() {

  function bindDividers() {
    app.querySelectorAll('[data-divider-id]').forEach(handle => {
      const node = findNode(tree(), handle.dataset.dividerId);
      if (!node) return;
      handle.addEventListener('pointerdown', event => {
        if (event.button !== 0 || !event.isPrimary) return;
        event.preventDefault();
        const box = handle.parentElement.getBoundingClientRect();
        const bounds = handle.getBoundingClientRect();
        const grabOffset = node.axis === 'x' ? event.clientX - bounds.left : event.clientY - bounds.top;
        handle.setPointerCapture(event.pointerId);
        handle.dataset.dragging = 'true';
        const move = moveEvent => {
          const ratio = node.axis === 'x' ? (moveEvent.clientX - box.left - grabOffset) / box.width : (moveEvent.clientY - box.top - grabOffset) / box.height;
          node.ratio = Math.max(0.15, Math.min(0.85, ratio));
          handle.parentElement.style.setProperty('--ratio', `${node.ratio * 100}%`);
          handle.setAttribute('aria-valuenow', String(Math.round(node.ratio * 100)));
        };
        const end = () => {
          handle.removeEventListener('pointermove', move);
          handle.removeEventListener('pointerup', end);
          handle.removeEventListener('pointercancel', end);
          delete handle.dataset.dragging;
          save();
        };
        handle.addEventListener('pointermove', move);
        handle.addEventListener('pointerup', end);
        handle.addEventListener('pointercancel', end);
      });
      handle.addEventListener('dblclick', () => { node.ratio = 0.5; save(); render(); });
      handle.addEventListener('keydown', event => {
        const negative = node.axis === 'x' ? 'ArrowLeft' : 'ArrowUp';
        const positive = node.axis === 'x' ? 'ArrowRight' : 'ArrowDown';
        if (![negative, positive, 'Home', 'End', 'Enter'].includes(event.key)) return;
        event.preventDefault();
        if (event.key === 'Home') node.ratio = 0.15;
        else if (event.key === 'End') node.ratio = 0.85;
        else if (event.key === 'Enter') node.ratio = 0.5;
        else node.ratio = Math.max(0.15, Math.min(0.85, node.ratio + (event.key === negative ? -0.03 : 0.03)));
        save(); render();
        app.querySelector(`[data-divider-id="${node.id}"]`)?.focus();
      });
    });
  }
  function bindSidebarResize() {
    const handle = app.querySelector('.sidebar-resize');
    const sidebar = app.querySelector('.host-sidebar');
    if (!handle || !sidebar) return;
    handle.addEventListener('pointerdown', event => {
      if (event.button !== 0) return;
      event.preventDefault();
      const startX = event.clientX;
      const startWidth = sidebar.offsetWidth;
      handle.setPointerCapture(event.pointerId);
      handle.dataset.dragging = 'true';
      const move = moveEvent => {
        const width = Math.max(160, Math.min(300, startWidth + moveEvent.clientX - startX));
        sidebar.style.width = `${width}px`;
        handle.setAttribute('aria-valuenow', String(width));
        state.sidebarWidth = width;
      };
      const end = () => {
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', end);
        handle.removeEventListener('pointercancel', end);
        delete handle.dataset.dragging;
        save();
      };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', end);
      handle.addEventListener('pointercancel', end);
    });
    handle.addEventListener('keydown', event => {
      if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
      event.preventDefault();
      state.sidebarWidth = event.key === 'Home' ? 160 : event.key === 'End' ? 300 : Math.max(160, Math.min(300, state.sidebarWidth + (event.key === 'ArrowLeft' ? -8 : 8)));
      save(); render(); app.querySelector('.sidebar-resize')?.focus();
    });
  }

  app.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;
    const id = button.dataset.id;
    if (action === 'select-date') { state.selectedDate = button.dataset.date; save(); render(); }
    else if (action === 'calendar-prev' || action === 'calendar-next') {
      const direction = action === 'calendar-prev' ? -1 : 1;
      const paneId = button.closest('[data-pane-id]')?.dataset.paneId;
      const amount = calendarDaysFor({ id: paneId });
      state.selectedDate = shift(state.selectedDate, direction * amount);
      save(); render();
    }
    else if (action === 'calendar-today') { state.selectedDate = TODAY; save(); render(); }
    else if (action === 'new-event') openEvent();
    else if (action === 'edit-event') {
      openEvent(id);
    }
    else if (action === 'toggle-task') {
      const task = state.tasks.find(item => item.id === id);
      task.completed = !task.completed; save(); render();
      app.querySelector(`[data-action="toggle-task"][data-id="${id}"]`)?.focus({ preventScroll: true });
      notify(task.completed ? '已完成，可在“已完成”中恢复' : '已恢复为待完成');
    }
    else if (action === 'edit-task') {
      openTask(id);
    }
    else if (action === 'todo-filter') { state.todoFilter = button.dataset.filter; transient.newTaskPane = null; save(); render(); }
    else if (action === 'focus-new-task') {
      const opening = transient.newTaskPane !== id;
      transient.newTaskPane = opening ? id : null;
      draftTitle = '';
      if (opening && state.todoFilter === 'completed') state.todoFilter = 'open';
      save(); render();
      if (opening) {
        const row = app.querySelector(`.todo-composer[data-pane-id="${id}"]`);
        row.querySelector('input').focus();
        if (event.detail && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          row.animate([{ opacity: 0.25 }, { opacity: 1 }], { duration: 140, easing: getComputedStyle(row).getPropertyValue('--ease-out').trim() });
        }
      }
      else app.querySelector(`[data-action="focus-new-task"][data-id="${id}"]`)?.focus();
    }
    else if (action === 'cancel-new-task') {
      const paneId = id;
      transient.newTaskPane = null; render();
      app.querySelector(`[data-action="focus-new-task"][data-id="${paneId}"]`)?.focus();
    }
    else if (action === 'task-menu') {
      const task = state.tasks.find(item => item.id === id);
      openMenu(button, task.title, [{ label: '编辑详情', icon: 'note', action: () => openTask(id) }, { label: task.completed ? '恢复待办' : '完成待办', icon: 'check', action: () => { task.completed = !task.completed; save(); render(); } }, { label: '删除待办', icon: 'close', danger: true, action: () => deleteTask(id) }]);
    }
    else if (action === 'launch') launch(button.dataset.source, id, button.closest('[data-pane-id]')?.dataset.paneId);
    else if (action === 'add-pin') addPin(button);
    else if (action === 'split-x' || action === 'split-y') splitPane(id, action === 'split-x' ? 'x' : 'y');
    else if (action === 'pane-menu') paneMenu(button, id);
    else if (action === 'close-pane') closePane(id);
    else if (action === 'zoom') {
      toggleZoom(id);
    }
    else if (action === 'replace-pane') { setTree(updateNode(tree(), id, node => ({ ...node, kind: button.dataset.kind }))); render(); }
    else if (action === 'new-workspace') newWorkspace();
    else if (action === 'switch-workspace') { state.workspace = id; transient.zoom = null; save(); render(); }
    else if (action === 'workspace-menu') workspaceMenu(button);
    else if (action === 'host-service') showHostService(button.dataset.service);
  });

  app.addEventListener('contextmenu', event => {
    const tile = event.target.closest('[data-context="launcher"]');
    if (!tile) return;
    event.preventDefault();
    launcherMenu(tile, tile.dataset.source, tile.dataset.id, tile.closest('[data-pane-id]')?.dataset.paneId);
  });
  app.addEventListener('change', event => {

    if (event.target.matches('[data-calendar-filter]')) {
      const name = event.target.dataset.calendarFilter;
      state.hiddenCalendars = event.target.checked ? state.hiddenCalendars.filter(item => item !== name) : [...new Set([...state.hiddenCalendars, name])];
      save(); render();
    }
  });
  app.addEventListener('input', event => {
    if (event.target.matches('.todo-composer input')) draftTitle = event.target.value;
  });
  app.addEventListener('keydown', event => {
    if (event.key === 'Escape' && event.target.closest('.todo-composer') && !event.isComposing) {
      event.preventDefault();
      const paneId = transient.newTaskPane;
      transient.newTaskPane = null;
      draftTitle = '';
      render();
      app.querySelector(`[data-action="focus-new-task"][data-id="${paneId}"]`)?.focus();
      return;
    }
  });

  document.addEventListener('submit', event => {
    const form = event.target;
    if (!form.dataset.form) return;
    event.preventDefault();
    const data = new FormData(form);
    const type = form.dataset.form;
    if (type === 'new-task') {
      const title = data.get('title').trim();
      if (!title) return;
      draftTitle = '';
      if (state.todoFilter === 'planned') state.todoFilter = 'open';
      state.tasks.unshift({ id: uid('t'), title, list: '个人', due: state.todoFilter === 'today' ? TODAY : '', priority: 'none', completed: false, notes: '' });
      save(); render();
      app.querySelector(`[data-form="new-task"][data-pane-id="${form.dataset.paneId}"] input`)?.focus();
      notify('待办已添加');
    } else if (type === 'event' || type === 'event-inline') {
      const id = form.dataset.id;
      const existing = state.events.find(item => item.id === id);
      const allDay = data.get('allDay') === 'true';
      if (!data.get('title')?.trim()) { notify('请填写日程标题'); return; }
      if (!allDay && data.get('end') <= data.get('start')) {
        const error = form.querySelector('.form-error');
        if (error) error.textContent = '结束时间需要晚于开始时间。';
        else notify('结束时间需要晚于开始时间');
        return;
      }
      const colors = { 工作: '#ff3b30', 设计: '#af52de', 个人: '#0a84ff' };
      const calendarName = data.get('calendar') || existing?.calendar || '工作';
      const next = {
        id: existing?.id || uid('e'), title: data.get('title').trim(), date: data.get('date'),
        allDay, calendar: calendarName, color: colors[calendarName],
        location: data.get('location') !== null ? data.get('location').trim() : existing?.location || '',
        notes: data.get('notes') !== null ? data.get('notes').trim() : existing?.notes || ''
      };
      if (!allDay) { next.start = data.get('start'); next.end = data.get('end'); }
      if (existing) Object.assign(existing, next); else state.events.push(next);
      state.selectedDate = next.date;

      save(); closeDialog(); render(); notify('日程已保存');
    } else if (type === 'task' || type === 'task-inline') {
      const task = state.tasks.find(item => item.id === form.dataset.id);
      if (!task) return;
      if (data.get('title') !== null) {
        const title = data.get('title').trim();
        if (!title) { notify('请填写待办标题'); return; }
        task.title = title;
      }
      task.due = data.get('due');
      task.priority = data.get('priority');
      task.notes = data.get('notes').trim();

      save(); closeDialog(); render(); notify('待办详情已保存');
    }
  });

  overlay.addEventListener('click', event => {
    const deleteEventButton = event.target.closest('[data-delete-event]');
    const deleteTaskButton = event.target.closest('[data-delete-task]');
    if (deleteEventButton) { const id = deleteEventButton.dataset.deleteEvent; closeDialog(); deleteEvent(id); }
    if (deleteTaskButton) { const id = deleteTaskButton.dataset.deleteTask; closeDialog(); deleteTask(id); }
  });
  document.addEventListener('pointerdown', event => {
    document.body.dataset.input = 'pointer';
    if (overlay.querySelector('.context-menu') && !event.target.closest('.context-menu') && !event.target.closest('[data-action="pane-menu"], [data-action="workspace-menu"], [data-action="split-x"], [data-action="split-y"]')) closeMenu();
  });
  document.addEventListener('keydown', event => {
    document.body.dataset.input = 'keyboard';
    const menu = overlay.querySelector('.context-menu');
    if (event.key === 'Escape' && menu) { event.preventDefault(); closeMenu(true); return; }
    if (menu && ['ArrowDown','ArrowUp','Home','End'].includes(event.key)) {
      event.preventDefault();
      const buttons = [...menu.querySelectorAll('button')];
      const index = buttons.indexOf(document.activeElement);
      const next = event.key === 'Home' ? 0 : event.key === 'End' ? buttons.length - 1 : (index + (event.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length;
      buttons[next]?.focus();
      return;
    }
  });
  render();
})();

  </script>
</body>
</html>
